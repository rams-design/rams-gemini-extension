# Keeps the extension's review content in lockstep with the canonical source at
# rams.ai/rams.md (which is what the curl installer serves and where edits
# land first). Runs nightly; opens no PR noise — commits only on real change.
name: Sync skill from rams.ai
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical skill
        run: |
          curl -fsSL https://rams.ai/rams.md -o /tmp/rams.md
          grep -q "Rams Design Review" /tmp/rams.md || { echo "sanity check failed"; exit 1; }
      - name: Regenerate skill + command
        run: |
          # SKILL.md needs a name key in frontmatter; the Gemini command is the
          # frontmatter-stripped body wrapped in TOML with {{args}} templating.
          awk 'NR==2{print "name: rams"} {print}' /tmp/rams.md > skills/rams/SKILL.md
          python3 - <<'EOF'
          import pathlib, tomllib
          canon = pathlib.Path("/tmp/rams.md").read_text()
          lines = canon.split("\n")
          assert lines[0] == "---" and lines[2] == "---", "unexpected frontmatter shape"
          body = "\n".join(lines[3:]).lstrip("\n").replace("$ARGUMENTS", "{{args}}")
          assert "'''" not in body, "content would break TOML literal string"
          toml = ('description = "Run accessibility and visual design review"\n'
                  "prompt = '''\n" + body.rstrip("\n") + "\n'''\n")
          tomllib.loads(toml)  # validate before writing
          pathlib.Path("commands/rams.toml").write_text(toml)
          EOF
      - name: Commit if changed
        run: |
          git config user.name "rams-sync"
          git config user.email "eli@rams.ai"
          git add -A
          git diff --cached --quiet && echo "no drift" && exit 0
          git commit -m "Sync skill content from rams.ai/rams.md"
          git push
